<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qwen-TTS Pipeline</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Qwen-TTS</h1>
      <input id="search" type="search" placeholder="Text suchen …" />
      <select id="filter-profile"><option value="">Alle Profile</option></select>
      <select id="filter-status">
        <option value="">Alle Status</option>
        <option value="missing">fehlt</option>
        <option value="stale">veraltet</option>
        <option value="rendered">fertig</option>
        <option value="locked">festgelegt</option>
      </select>
      <button id="btn-params"
              title="Stimme, Sprache, Instruktion und Sampling aller Profile bearbeiten">
        ⚙️ TTS-Parameter</button>
      <button id="btn-render" class="primary"
              title="Erzeugt Kandidaten für die links ausgewählten Clips — nur was fehlt oder veraltet ist. Produktion bestätigt man danach pro Clip in der Kandidaten-Liste.">
        ▶ Batch-Lauf</button>
      <input id="batch-count" type="number" min="1" max="16" value="2"
             title="Anzahl Beispiele pro Clip (1–16)" /> Stück
      <button id="btn-export"
              title="Konvertiert alle bestätigten, fertig gerenderten Clips nach OGG und aktualisiert die App-Assets (app/src/main/assets/audio/).">
        📦 In App exportieren</button>
      <div id="job">
        <span id="job-spinner" class="spinner hidden"></span>
        <div id="job-bar-track" class="hidden"><div id="job-bar"></div></div>
        <span id="job-text"></span>
        <button id="btn-cancel" class="hidden">Abbrechen</button>
      </div>
    </header>
    <div id="banner" class="hidden">
      <span id="banner-text"></span>
      <button id="banner-close" title="Meldung schließen">×</button>
    </div>
    <main>
      <div id="list-pane">
        <div id="list-tools">
          <span class="muted small">Auswahl für den Batch-Lauf:</span>
          <button id="sel-visible" title="Alle aktuell sichtbaren (gefilterten) Clips auswählen">Sichtbare</button>
          <button id="sel-all" title="Alle Clips auswählen">Alle</button>
          <button id="sel-none" title="Auswahl leeren">Keine</button>
          <span id="sel-count" class="muted small"></span>
        </div>
        <div id="list"></div>
      </div>
      <div id="detail">
        <p class="muted">Links einen Clip wählen.
          Tasten: j/k blättern, Leertaste spielt, 1–9 spielen Kandidaten.</p>
      </div>
    </main>
    <div id="params-panel" class="hidden"></div>
    <script src="/app.js"></script>
  </body>
</html>
