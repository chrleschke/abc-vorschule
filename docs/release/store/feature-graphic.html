  Rendern:

      --hide-scrollbars --window-size=1024,500 --virtual-time-budget=5000 \
      --screenshot=feature-graphic-1024x500.png file://…/feature-graphic.html

  Landschaft und Schild stammen aus ic_launcher_background.xml / ic_launcher_foreground.xml.
  Sonne, Wolken, Baum und das gesamte Schild (Pfosten, Brett, Nägel, ABC, Stern) sind die
  Original-Pfade, nur per transform skaliert/verschoben. Die drei Hügel sind über 1024 px

-->
